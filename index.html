<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087d4c" />
    <meta
      name="description"
      content="归心，深圳贝壳品质工具箱。"
    />
    <title>归心｜深圳贝壳品质工具箱</title>
    <style>
      :root {
        --ink: #17231e;
        --muted: #7a8880;
        --line: #e3ebe6;
        --paper: #f8faf8;
        --white: #ffffff;
        --green: #087d4c;
        --green-dark: #05613a;
        --green-soft: #eaf7ef;
      }

      * { box-sizing: border-box; }
      html { background: var(--paper); }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 50% -16%, rgba(115, 212, 161, 0.14), transparent 31rem),
          var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button,
      textarea { font: inherit; }

      button { -webkit-tap-highlight-color: transparent; }

      .shell {
        display: flex;
        width: min(100% - 48px, 1180px);
        min-height: 100vh;
        margin: 0 auto;
        flex-direction: column;
      }

      header {
        display: flex;
        min-height: 92px;
        align-items: center;
        border-bottom: 1px solid var(--line);
      }

      .brand-wrap {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 12px;
        background: var(--green);
        color: #fff;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.08em;
      }

      .brand {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.055em;
      }

      .tagline {
        margin: 0 0 0 auto;
        color: var(--muted);
        font-size: 14px;
        letter-spacing: 0.015em;
      }

      main {
        display: flex;
        flex: 1;
        align-items: center;
        padding: 72px 0;
      }

      .modules {
        display: grid;
        width: 100%;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        display: flex;
        min-width: 0;
        min-height: 216px;
        align-items: flex-start;
        flex-direction: column;
        justify-content: space-between;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        background: var(--white);
        color: var(--ink);
        cursor: pointer;
        text-align: left;
        text-decoration: none;
        transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }

      .card:hover,
      .card:focus-visible {
        border-color: #9cd6b6;
        box-shadow: 0 16px 32px rgba(5, 97, 58, 0.1);
        outline: 0;
        transform: translateY(-3px);
      }

      .card:active { transform: translateY(-1px); }

      .icon {
        display: grid;
        width: 46px;
        height: 46px;
        place-items: center;
        border-radius: 14px;
        background: var(--green-soft);
        color: var(--green-dark);
        font-size: 18px;
        font-weight: 800;
      }

      .card-bottom {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .card-name {
        min-width: 0;
        margin: 0;
        font-size: 17px;
        font-weight: 750;
        letter-spacing: -0.035em;
        line-height: 1.35;
      }

      .arrow {
        flex: 0 0 auto;
        color: var(--green);
        font-size: 20px;
        line-height: 1;
      }

      .empty { display: none; }

      footer {
        padding: 26px 0 34px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .overlay {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(23, 35, 30, 0.3);
      }

      .overlay[hidden] { display: none; }

      .dialog {
        position: relative;
        width: min(100%, 540px);
        border-radius: 18px;
        padding: 26px;
        background: #fff;
        box-shadow: 0 28px 80px rgba(23, 35, 30, 0.22);
      }

      .dialog h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.04em;
      }

      .close {
        position: absolute;
        top: 14px;
        right: 14px;
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 24px;
        line-height: 1;
      }

      .close:hover,
      .close:focus-visible {
        background: var(--paper);
        color: var(--ink);
        outline: 0;
      }

      .dialog label {
        display: block;
        margin: 22px 0 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 150px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px;
        background: #fff;
        color: var(--ink);
        font-size: 14px;
        line-height: 1.6;
      }

      textarea:focus {
        border-color: #77c79e;
        outline: 3px solid rgba(119, 199, 158, 0.18);
      }

      .copy {
        width: 100%;
        margin-top: 14px;
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        background: var(--green);
        color: #fff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 750;
      }

      .copy:hover,
      .copy:focus-visible {
        background: var(--green-dark);
        outline: 0;
      }

      @media (max-width: 980px) {
        main { padding: 52px 0; }
        .modules { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }

      @media (max-width: 600px) {
        .shell { width: min(100% - 28px, 560px); }
        header { min-height: 68px; }
        .brand-wrap { gap: 8px; }

        .mark {
          width: 30px;
          height: 30px;
          border-radius: 10px;
          font-size: 15px;
        }

        .brand { font-size: 19px; }

        .tagline {
          max-width: 190px;
          overflow: hidden;
          font-size: 11px;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        main {
          align-items: flex-start;
          padding: 38px 0 48px;
        }

        .modules {
          gap: 0;
          overflow: hidden;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          border: 1px solid var(--line);
          border-radius: 16px;
          background: var(--white);
        }

        .card,
        .empty {
          min-height: 122px;
          border: 0;
          border-right: 1px solid var(--line);
          border-bottom: 1px solid var(--line);
          border-radius: 0;
        }

        .card {
          align-items: center;
          justify-content: center;
          padding: 12px 6px;
          text-align: center;
          transition: background 140ms ease;
        }

        .card:hover,
        .card:focus-visible {
          border-color: var(--line);
          box-shadow: none;
          outline: 0;
          transform: none;
        }

        .card:active { background: var(--green-soft); }

        .card:nth-child(3n),
        .empty:nth-child(3n) { border-right: 0; }

        .modules > :nth-child(n + 7) { border-bottom: 0; }

        .icon {
          width: 36px;
          height: 36px;
          border-radius: 11px;
          font-size: 15px;
        }

        .card-bottom {
          display: block;
          width: auto;
          margin-top: 9px;
        }

        .card-name { font-size: 13px; white-space: nowrap; }
        .arrow { display: none; }

        .empty {
          display: block;
          background: rgba(248, 250, 248, 0.72);
        }

        footer {
          padding: 22px 0 28px;
          font-size: 12px;
        }

        .dialog { padding: 22px 18px 18px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand-wrap" aria-label="归心">
          <span class="mark" aria-hidden="true">归</span>
          <strong class="brand">归心</strong>
        </div>
        <p class="tagline">回归到客户服务的初心</p>
      </header>

      <main>
        <section class="modules" aria-label="归心模块">
          <button class="card" type="button" data-workspace="complaint" aria-label="客户投诉">
            <span class="icon" aria-hidden="true">诉</span>
            <span class="card-bottom"><span class="card-name">客户投诉</span><span class="arrow" aria-hidden="true">→</span></span>
          </button>

          <a class="card" href="https://moma.ke.com/chat/45a870b8-adf5-4c9c-ae84-4404c1a03ced" aria-label="陪审团">
            <span class="icon" aria-hidden="true">审</span>
            <span class="card-bottom"><span class="card-name">陪审团</span><span class="arrow" aria-hidden="true">↗</span></span>
          </a>

          <a class="card" href="https://app-moma.ke.com/cmy" aria-label="共治理事会">
            <span class="icon" aria-hidden="true">治</span>
            <span class="card-bottom"><span class="card-name">共治理事会</span><span class="arrow" aria-hidden="true">↗</span></span>
          </a>

          <a class="card" href="https://app-moma.ke.com/0508ed9e-ecf3-40d3-b34c-b2fa697170e0" aria-label="监察一码通">
            <span class="icon" aria-hidden="true">监</span>
            <span class="card-bottom"><span class="card-name">监察一码通</span><span class="arrow" aria-hidden="true">↗</span></span>
          </a>

          <button class="card" type="button" data-workspace="performance" aria-label="业绩争议">
            <span class="icon" aria-hidden="true">绩</span>
            <span class="card-bottom"><span class="card-name">业绩争议</span><span class="arrow" aria-hidden="true">→</span></span>
          </button>

          <div class="empty" aria-hidden="true"></div>
          <div class="empty" aria-hidden="true"></div>
          <div class="empty" aria-hidden="true"></div>
          <div class="empty" aria-hidden="true"></div>
        </section>
      </main>

      <footer>深圳贝壳品质工具箱</footer>
    </div>

    <div class="overlay" id="workspace" hidden>
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="workspace-title">
        <button class="close" type="button" aria-label="关闭">×</button>
        <h2 id="workspace-title"></h2>
        <label for="workspace-input">记录事实</label>
        <textarea id="workspace-input"></textarea>
        <button class="copy" type="button" id="copy-workspace">复制给 AI 助手</button>
      </section>
    </div>

    <script>
      const workspaces = {
        complaint: {
          title: "客户投诉",
          placeholder: "写下时间、人物、客户原话和已做处理",
          prompt: "请以房地产客户服务主管的视角，整理以下客户投诉。只基于已提供的事实，不替任何一方下结论。请按事实时间线、客户核心诉求、需要核实的信息、责任边界、今天能执行的处理方案和对客户的回复话术输出。",
        },
        performance: {
          title: "业绩争议",
          placeholder: "写下时间、规则原文和双方说法",
          prompt: "请中立整理以下业绩争议，不替任何一方判定归属。请按关键时间线、适用规则或制度、各方主张、证据清单、仍有争议的事实、需要谁确认和两种低冲突的沟通话术输出。规则原文未提供时，请明确写出需要补充规则原文。",
        },
      };

      const overlay = document.getElementById("workspace");
      const title = document.getElementById("workspace-title");
      const input = document.getElementById("workspace-input");
      const copy = document.getElementById("copy-workspace");
      let activeWorkspace = null;

      function closeWorkspace() {
        overlay.hidden = true;
        activeWorkspace = null;
      }

      document.querySelectorAll("[data-workspace]").forEach((button) => {
        button.addEventListener("click", () => {
          activeWorkspace = workspaces[button.dataset.workspace];
          title.textContent = activeWorkspace.title;
          input.placeholder = activeWorkspace.placeholder;
          input.value = "";
          copy.textContent = "复制给 AI 助手";
          overlay.hidden = false;
          input.focus();
        });
      });

      document.querySelector(".close").addEventListener("click", closeWorkspace);
      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) closeWorkspace();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !overlay.hidden) closeWorkspace();
      });

      copy.addEventListener("click", async () => {
        if (!activeWorkspace) return;
        const content = activeWorkspace.prompt + "\n\n" + (input.value.trim() || "请填写事实。");
        try {
          await navigator.clipboard.writeText(content);
          copy.textContent = "已复制";
        } catch {
          input.value = content;
          input.select();
          document.execCommand("copy");
          copy.textContent = "已复制";
        }
      });
    </script>
  </body>
</html>
