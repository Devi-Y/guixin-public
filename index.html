<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087d4c" />
    <meta name="description" content="归心，深圳贝壳品质工具箱。" />
    <title>归心｜深圳贝壳品质工具箱</title>
    <style>
      :root {
        --ink: #1f2329;
        --muted: #727983;
        --subtle: #a4abb2;
        --line: #e4ebe6;
        --paper: #f5f8f6;
        --surface: #ffffff;
        --green: #00ae66;
        --green-dark: #008950;
        --green-soft: #eaf8f1;
      }

      * { box-sizing: border-box; }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        background:
          radial-gradient(circle at 50% -12%, rgba(0, 174, 102, 0.1), transparent 34rem),
          linear-gradient(180deg, #f7faf8 0%, var(--paper) 100%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button,
      textarea { font: inherit; }

      button { -webkit-tap-highlight-color: transparent; }

      .site {
        width: min(100% - 56px, 1340px);
        min-height: 100dvh;
        margin: 0 auto;
      }

      header {
        display: flex;
        min-height: 92px;
        align-items: center;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 13px;
        background: var(--green);
        box-shadow: 0 7px 16px rgba(0, 174, 102, 0.18);
        color: #fff;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.08em;
      }

      .brand-name {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.06em;
      }

      .tagline {
        margin: 0 0 0 auto;
        color: var(--muted);
        font-size: 14px;
        letter-spacing: 0.01em;
      }

      main {
        padding: 42px 0 48px;
      }

      .tool-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .tool-card,
      .placeholder {
        min-width: 0;
        min-height: 232px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: 0 8px 20px rgba(31, 35, 41, 0.035);
      }

      .tool-card {
        display: flex;
        flex-direction: column;
        padding: 26px;
        color: inherit;
        cursor: pointer;
        text-align: left;
        text-decoration: none;
        transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }

      .tool-card:hover,
      .tool-card:focus-visible {
        border-color: #a9dec2;
        box-shadow: 0 16px 34px rgba(0, 122, 73, 0.1);
        outline: 0;
        transform: translateY(-3px);
      }

      .tool-card:active { transform: translateY(-1px); }
      .tool-card.is-primary { border-color: #9bdfba; }

      .card-icon {
        display: grid;
        width: 62px;
        height: 62px;
        place-items: center;
        border-radius: 21px;
        background: #f0f7f3;
      }

      .card-icon svg {
        width: 30px;
        height: 30px;
        stroke: var(--accent);
      }

      .complaint { --accent: #00aa62; }
      .jury { --accent: #377dff; }
      .governance { --accent: #f59a00; }
      .supervision { --accent: #ef4c52; }
      .performance { --accent: #8d5bff; }

      .tool-card h2 {
        margin: 22px 0 0;
        color: var(--ink);
        font-size: clamp(1.2rem, 2vw, 1.55rem);
        font-weight: 780;
        letter-spacing: -0.045em;
        line-height: 1.3;
      }

      .tool-card p {
        min-height: 2.9em;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }

      .card-action {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: auto;
        padding-top: 22px;
        color: var(--green-dark);
        font-size: 15px;
        font-weight: 760;
        line-height: 1;
      }

      .card-action .arrow {
        font-size: 27px;
        font-weight: 400;
        line-height: 0.6;
        transition: transform 160ms ease;
      }

      .tool-card:hover .card-action .arrow,
      .tool-card:focus-visible .card-action .arrow { transform: translateX(4px); }

      .placeholder {
        display: grid;
        place-items: center;
        border-style: dashed;
        border-color: #e6ece8;
        background: rgba(255, 255, 255, 0.52);
        box-shadow: none;
        color: #c5cec8;
      }

      .placeholder span {
        font-size: 32px;
        font-weight: 300;
        line-height: 1;
      }

      footer {
        padding: 24px 0 34px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.015em;
        text-align: center;
      }

      .overlay {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(31, 35, 41, 0.3);
        backdrop-filter: blur(3px);
      }

      .overlay[hidden] { display: none; }

      .dialog {
        position: relative;
        width: min(100%, 540px);
        border-radius: 20px;
        padding: 26px;
        background: #fff;
        box-shadow: 0 30px 84px rgba(31, 35, 41, 0.24);
      }

      .dialog h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.04em;
      }

      .close {
        position: absolute;
        top: 13px;
        right: 13px;
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 25px;
        line-height: 1;
      }

      .close:hover,
      .close:focus-visible {
        background: #f0f5f2;
        color: var(--ink);
        outline: 0;
      }

      .dialog label {
        display: block;
        margin: 22px 0 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 150px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 13px;
        background: #fff;
        color: var(--ink);
        font-size: 14px;
        line-height: 1.6;
      }

      textarea:focus {
        border-color: #79cba2;
        outline: 3px solid rgba(0, 174, 102, 0.16);
      }

      .copy {
        width: 100%;
        margin-top: 14px;
        border: 0;
        border-radius: 13px;
        padding: 12px 16px;
        background: var(--green);
        color: #fff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 750;
      }

      .copy:hover,
      .copy:focus-visible {
        background: var(--green-dark);
        outline: 0;
      }

      @media (max-width: 1024px) {
        .site { width: min(100% - 40px, 940px); }
        main { padding: 30px 0 38px; }
        .tool-grid { gap: 14px; }
        .tool-card,
        .placeholder { min-height: 210px; border-radius: 20px; }
        .tool-card { padding: 20px; }
        .card-icon { width: 54px; height: 54px; border-radius: 18px; }
        .tool-card h2 { margin-top: 17px; font-size: 19px; }
        .tool-card p { margin-top: 7px; font-size: 13px; }
        .card-action { padding-top: 16px; font-size: 13px; }
      }

      @media (max-width: 700px) {
        .site { width: min(100% - 28px, 640px); }
        header { min-height: 76px; }
        .brand-mark { width: 33px; height: 33px; border-radius: 11px; font-size: 16px; }
        .brand-name { font-size: 20px; }
        .tagline { font-size: 12px; }
        .tool-card,
        .placeholder { min-height: 178px; }
        .tool-card { padding: 16px; }
        .card-icon { width: 48px; height: 48px; border-radius: 16px; }
        .card-icon svg { width: 26px; height: 26px; }
        .tool-card h2 { margin-top: 13px; font-size: 16px; }
        .tool-card p { min-height: 3em; font-size: 12px; }
        .card-action { padding-top: 12px; font-size: 12px; }
      }

      @media (max-width: 600px) {
        body { background: #fff; }

        .site {
          width: 100%;
          min-height: 100dvh;
        }

        header {
          min-height: 66px;
          padding: 13px max(15px, env(safe-area-inset-left)) 13px max(15px, env(safe-area-inset-right));
        }

        .brand { gap: 8px; }
        .brand-mark { width: 30px; height: 30px; border-radius: 10px; font-size: 14px; }
        .brand-name { font-size: 19px; }

        .tagline {
          max-width: 195px;
          overflow: hidden;
          font-size: 11px;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        main { padding: 0; }

        .tool-grid {
          gap: 0;
          border-top: 1px solid var(--line);
          border-bottom: 1px solid var(--line);
        }

        .tool-card,
        .placeholder {
          min-height: 122px;
          border: 0;
          border-right: 1px solid var(--line);
          border-bottom: 1px solid var(--line);
          border-radius: 0;
          box-shadow: none;
        }

        .tool-card:nth-child(3n),
        .placeholder:nth-child(3n) { border-right: 0; }

        .tool-grid > :nth-child(n + 7) { border-bottom: 0; }

        .tool-card {
          align-items: center;
          justify-content: center;
          padding: 10px 4px;
          text-align: center;
        }

        .tool-card:hover,
        .tool-card:focus-visible {
          border-color: var(--line);
          box-shadow: none;
          outline: 0;
          transform: none;
        }

        .tool-card:active { background: #f3fbf6; }

        .card-icon { width: 38px; height: 38px; border-radius: 13px; }
        .card-icon svg { width: 20px; height: 20px; }
        .tool-card h2 { margin-top: 8px; font-size: 13px; white-space: nowrap; }
        .tool-card p,
        .card-action { display: none; }
        .placeholder { background: #fbfcfb; }
        .placeholder span { font-size: 24px; }

        footer {
          padding: 20px max(15px, env(safe-area-inset-right)) max(25px, env(safe-area-inset-bottom));
          font-size: 12px;
        }

        .dialog { padding: 22px 18px 18px; }
      }
    </style>
  </head>
  <body>
    <div class="site">
      <header>
        <div class="brand" aria-label="归心">
          <span class="brand-mark" aria-hidden="true">归</span>
          <strong class="brand-name">归心</strong>
        </div>
        <p class="tagline">回归到客户服务的初心</p>
      </header>

      <main>
        <section class="tool-grid" aria-label="归心九宫格模块">
          <button class="tool-card complaint chat is-primary" type="button" data-workspace="complaint" aria-label="客户投诉，立即开始">
            <span class="card-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/></svg></span>
            <h2>客户投诉</h2>
            <p>整理客诉事实并生成回复</p>
            <span class="card-action">立即开始 <span class="arrow" aria-hidden="true">→</span></span>
          </button>

          <a class="tool-card jury person" href="https://moma.ke.com/chat/45a870b8-adf5-4c9c-ae84-4404c1a03ced" aria-label="陪审团，打开链接">
            <span class="card-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span>
            <h2>陪审团</h2>
            <p>处理争议与分歧</p>
            <span class="card-action">打开链接 <span class="arrow" aria-hidden="true">↗</span></span>
          </a>

          <a class="tool-card governance bank" href="https://app-moma.ke.com/cmy" aria-label="共治理事会，打开链接">
            <span class="card-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18v-7"/><path d="M11.119 2.205a2 2 0 0 1 1.762 0l7.84 3.846A.5.5 0 0 1 20.5 7h-17a.5.5 0 0 1-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/></svg></span>
            <h2>共治理事会</h2>
            <p>协同区域问题</p>
            <span class="card-action">打开链接 <span class="arrow" aria-hidden="true">↗</span></span>
          </a>

          <a class="tool-card supervision eye" href="https://app-moma.ke.com/0508ed9e-ecf3-40d3-b34c-b2fa697170e0" aria-label="监察一码通，打开链接">
            <span class="card-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></span>
            <h2>监察一码通</h2>
            <p>提交监察问题</p>
            <span class="card-action">打开链接 <span class="arrow" aria-hidden="true">↗</span></span>
          </a>

          <button class="tool-card performance scale" type="button" data-workspace="performance" aria-label="业绩争议，立即开始">
            <span class="card-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/><path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M7 21h10"/></svg></span>
            <h2>业绩争议</h2>
            <p>核对规则和证据，准备沟通</p>
            <span class="card-action">立即开始 <span class="arrow" aria-hidden="true">→</span></span>
          </button>

          <div class="placeholder" aria-label="预留模块位"><span aria-hidden="true">＋</span></div>
          <div class="placeholder" aria-label="预留模块位"><span aria-hidden="true">＋</span></div>
          <div class="placeholder" aria-label="预留模块位"><span aria-hidden="true">＋</span></div>
          <div class="placeholder" aria-label="预留模块位"><span aria-hidden="true">＋</span></div>
        </section>
      </main>

      <footer>深圳贝壳品质工具箱</footer>
    </div>

    <div class="overlay" id="workspace" hidden>
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="workspace-title">
        <button class="close" type="button" aria-label="关闭">×</button>
        <h2 id="workspace-title"></h2>
        <label for="workspace-input">记录事实</label>
        <textarea id="workspace-input"></textarea>
        <button class="copy" type="button" id="copy-workspace">复制给 AI 助手</button>
      </section>
    </div>

    <script>
      const workspaces = {
        complaint: {
          title: "客户投诉",
          placeholder: "写下时间、人物、客户原话和已做处理",
          prompt: "请以房地产客户服务主管的视角，整理以下客户投诉。只基于已提供的事实，不替任何一方下结论。请按事实时间线、客户核心诉求、需要核实的信息、责任边界、今天能执行的处理方案和对客户的回复话术输出。",
        },
        performance: {
          title: "业绩争议",
          placeholder: "写下时间、规则原文和双方说法",
          prompt: "请中立整理以下业绩争议，不替任何一方判定归属。请按关键时间线、适用规则或制度、各方主张、证据清单、仍有争议的事实、需要谁确认和两种低冲突的沟通话术输出。规则原文未提供时，请明确写出需要补充规则原文。",
        },
      };

      const overlay = document.getElementById("workspace");
      const title = document.getElementById("workspace-title");
      const input = document.getElementById("workspace-input");
      const copy = document.getElementById("copy-workspace");
      let activeWorkspace = null;

      function closeWorkspace() {
        overlay.hidden = true;
        activeWorkspace = null;
      }

      document.querySelectorAll("[data-workspace]").forEach((button) => {
        button.addEventListener("click", () => {
          activeWorkspace = workspaces[button.dataset.workspace];
          title.textContent = activeWorkspace.title;
          input.placeholder = activeWorkspace.placeholder;
          input.value = "";
          copy.textContent = "复制给 AI 助手";
          overlay.hidden = false;
          input.focus();
        });
      });

      document.querySelector(".close").addEventListener("click", closeWorkspace);
      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) closeWorkspace();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !overlay.hidden) closeWorkspace();
      });

      copy.addEventListener("click", async () => {
        if (!activeWorkspace) return;
        const content = activeWorkspace.prompt + "\n\n" + (input.value.trim() || "请填写事实。");
        try {
          await navigator.clipboard.writeText(content);
          copy.textContent = "已复制";
        } catch {
          input.value = content;
          input.select();
          document.execCommand("copy");
          copy.textContent = "已复制";
        }
      });
    </script>
  </body>
</html>
