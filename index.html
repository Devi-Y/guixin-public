<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087d4c" />
    <meta name="description" content="归心，深圳贝壳品质工具箱。" />
    <title>归心｜深圳贝壳品质工具箱</title>
    <style>
      :root {
        --ink: #1f2c25;
        --muted: #849188;
        --line: #e6ece8;
        --paper: #f3f7f4;
        --green: #07804b;
        --green-dark: #05653c;
      }

      * { box-sizing: border-box; }

      html,
      body { min-width: 320px; min-height: 100%; }

      body {
        min-height: 100dvh;
        margin: 0;
        background:
          radial-gradient(circle at 50% 0, rgba(107, 206, 155, 0.16), transparent 30rem),
          linear-gradient(180deg, #f7faf8 0%, var(--paper) 100%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button,
      textarea { font: inherit; }

      button { -webkit-tap-highlight-color: transparent; }

      .page {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: 32px;
      }

      .portal {
        display: flex;
        width: min(100%, 760px);
        height: min(760px, calc(100dvh - 64px));
        min-height: 520px;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(7, 128, 75, 0.12);
        border-radius: 28px;
        background: #fff;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9) inset,
          0 26px 68px rgba(25, 53, 37, 0.1),
          0 6px 18px rgba(7, 128, 75, 0.05);
      }

      header {
        display: flex;
        min-height: 94px;
        align-items: center;
        padding: 20px 28px;
        border-bottom: 1px solid var(--line);
        background:
          linear-gradient(100deg, rgba(230, 247, 237, 0.76), rgba(255, 255, 255, 0) 52%),
          #fff;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
      }

      .mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(145deg, #0b9a5c, #057443);
        box-shadow: 0 7px 16px rgba(7, 128, 75, 0.2);
        color: #fff;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.08em;
      }

      .brand-name {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.07em;
      }

      .tagline {
        margin: 0 0 0 auto;
        color: var(--muted);
        font-size: 14px;
        letter-spacing: 0.015em;
      }

      main {
        display: flex;
        min-height: 0;
        flex: 1;
      }

      .modules {
        display: grid;
        width: 100%;
        min-height: 0;
        flex: 1;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        background: #fff;
      }

      .tile {
        position: relative;
        display: flex;
        min-width: 0;
        min-height: 0;
        align-items: center;
        justify-content: center;
        border: 0;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        transition: background 160ms ease, box-shadow 160ms ease;
      }

      .tile:nth-child(3n) { border-right: 0; }
      .tile:nth-child(n + 7) { border-bottom: 0; }

      .tile:hover,
      .tile:focus-visible {
        z-index: 1;
        background: var(--surface);
        box-shadow: inset 0 0 0 2px var(--edge);
        outline: 0;
      }

      .tile:active { background: var(--surface); }

      .tile-content {
        display: flex;
        min-width: 0;
        align-items: center;
        flex-direction: column;
        gap: 12px;
      }

      .icon {
        display: grid;
        width: 54px;
        height: 54px;
        place-items: center;
        border-radius: 18px;
        background: var(--icon-bg);
        box-shadow: 0 8px 18px var(--icon-shadow);
        color: var(--accent);
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.06em;
        transition: transform 160ms ease;
      }

      .tile:hover .icon,
      .tile:focus-visible .icon { transform: translateY(-2px) scale(1.04); }

      .tile-name {
        min-width: 0;
        padding: 0 10px;
        font-size: 16px;
        font-weight: 750;
        letter-spacing: -0.04em;
        line-height: 1.35;
      }

      .direction {
        position: absolute;
        top: 15px;
        right: 16px;
        color: var(--accent);
        font-size: 17px;
        font-weight: 500;
        line-height: 1;
      }

      .complaint {
        --accent: #07804b;
        --surface: #effaf4;
        --edge: rgba(7, 128, 75, 0.18);
        --icon-bg: #e7f8ee;
        --icon-shadow: rgba(7, 128, 75, 0.15);
      }

      .jury {
        --accent: #2f76b9;
        --surface: #f0f7ff;
        --edge: rgba(47, 118, 185, 0.18);
        --icon-bg: #e8f3ff;
        --icon-shadow: rgba(47, 118, 185, 0.14);
      }

      .governance {
        --accent: #b26e16;
        --surface: #fff8eb;
        --edge: rgba(178, 110, 22, 0.18);
        --icon-bg: #fff1d8;
        --icon-shadow: rgba(178, 110, 22, 0.13);
      }

      .supervision {
        --accent: #b34d67;
        --surface: #fff2f5;
        --edge: rgba(179, 77, 103, 0.18);
        --icon-bg: #fde9ee;
        --icon-shadow: rgba(179, 77, 103, 0.13);
      }

      .performance {
        --accent: #7355b6;
        --surface: #f6f2ff;
        --edge: rgba(115, 85, 182, 0.18);
        --icon-bg: #eee8ff;
        --icon-shadow: rgba(115, 85, 182, 0.13);
      }

      .placeholder {
        cursor: default;
        background: #fbfcfb;
        color: #c2cbc5;
      }

      .placeholder:hover,
      .placeholder:focus-visible {
        z-index: auto;
        background: #fbfcfb;
        box-shadow: none;
      }

      .plus {
        color: #c8d1cb;
        font-size: 30px;
        font-weight: 300;
        line-height: 1;
      }

      footer {
        min-height: 64px;
        padding: 18px 24px;
        border-top: 1px solid var(--line);
        background: #fafcfb;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.02em;
        line-height: 1.5;
        text-align: center;
      }

      .overlay {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(18, 37, 27, 0.34);
        backdrop-filter: blur(3px);
      }

      .overlay[hidden] { display: none; }

      .dialog {
        position: relative;
        width: min(100%, 520px);
        border: 1px solid rgba(7, 128, 75, 0.12);
        border-radius: 20px;
        padding: 26px;
        background: #fff;
        box-shadow: 0 28px 84px rgba(19, 42, 29, 0.24);
      }

      .dialog h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.04em;
      }

      .close {
        position: absolute;
        top: 13px;
        right: 13px;
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 25px;
        line-height: 1;
      }

      .close:hover,
      .close:focus-visible {
        background: #f1f5f2;
        color: var(--ink);
        outline: 0;
      }

      .dialog label {
        display: block;
        margin: 22px 0 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 150px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 13px;
        background: #fff;
        color: var(--ink);
        font-size: 14px;
        line-height: 1.6;
      }

      textarea:focus {
        border-color: #78c79e;
        outline: 3px solid rgba(120, 199, 158, 0.18);
      }

      .copy {
        width: 100%;
        margin-top: 14px;
        border: 0;
        border-radius: 13px;
        padding: 12px 16px;
        background: var(--green);
        color: #fff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 750;
      }

      .copy:hover,
      .copy:focus-visible {
        background: var(--green-dark);
        outline: 0;
      }

      @media (max-width: 800px) {
        .page { padding: 22px; }
        .portal {
          width: min(100%, 680px);
          height: min(740px, calc(100dvh - 44px));
          border-radius: 24px;
        }
      }

      @media (max-width: 600px) {
        body { background: #fff; }

        .page {
          display: block;
          padding: 0;
        }

        .portal {
          width: 100%;
          height: 100dvh;
          min-height: 520px;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }

        header {
          min-height: 72px;
          padding: 14px max(16px, env(safe-area-inset-left)) 14px max(16px, env(safe-area-inset-right));
        }

        .brand { gap: 8px; }

        .mark {
          width: 32px;
          height: 32px;
          border-radius: 11px;
          font-size: 15px;
        }

        .brand-name { font-size: 20px; }

        .tagline {
          max-width: 190px;
          overflow: hidden;
          font-size: 11px;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .tile-content { gap: 8px; }

        .icon {
          width: 39px;
          height: 39px;
          border-radius: 13px;
          font-size: 16px;
        }

        .tile-name {
          padding: 0 4px;
          font-size: 13px;
          white-space: nowrap;
        }

        .direction {
          top: 11px;
          right: 11px;
          font-size: 13px;
        }

        .plus { font-size: 24px; }

        footer {
          min-height: 58px;
          padding: 17px max(16px, env(safe-area-inset-right)) max(17px, env(safe-area-inset-bottom));
          font-size: 12px;
        }

        .dialog { padding: 22px 18px 18px; }
      }

      @media (max-height: 620px) and (min-width: 601px) {
        .page { padding: 18px; }
        .portal { height: calc(100dvh - 36px); min-height: 460px; }
        header { min-height: 76px; padding-top: 14px; padding-bottom: 14px; }
        footer { min-height: 54px; padding: 14px; }
        .icon { width: 44px; height: 44px; border-radius: 15px; font-size: 18px; }
        .tile-content { gap: 8px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="portal">
        <header>
          <div class="brand" aria-label="归心">
            <span class="mark" aria-hidden="true">归</span>
            <strong class="brand-name">归心</strong>
          </div>
          <p class="tagline">回归到客户服务的初心</p>
        </header>

        <main>
          <section class="modules" aria-label="归心九宫格">
            <button class="tile complaint" type="button" data-workspace="complaint" aria-label="客户投诉">
              <span class="direction" aria-hidden="true">→</span>
              <span class="tile-content">
                <span class="icon" aria-hidden="true">诉</span>
                <span class="tile-name">客户投诉</span>
              </span>
            </button>

            <a class="tile jury" href="https://moma.ke.com/chat/45a870b8-adf5-4c9c-ae84-4404c1a03ced" aria-label="陪审团">
              <span class="direction" aria-hidden="true">↗</span>
              <span class="tile-content">
                <span class="icon" aria-hidden="true">审</span>
                <span class="tile-name">陪审团</span>
              </span>
            </a>

            <a class="tile governance" href="https://app-moma.ke.com/cmy" aria-label="共治理事会">
              <span class="direction" aria-hidden="true">↗</span>
              <span class="tile-content">
                <span class="icon" aria-hidden="true">治</span>
                <span class="tile-name">共治理事会</span>
              </span>
            </a>

            <a class="tile supervision" href="https://app-moma.ke.com/0508ed9e-ecf3-40d3-b34c-b2fa697170e0" aria-label="监察一码通">
              <span class="direction" aria-hidden="true">↗</span>
              <span class="tile-content">
                <span class="icon" aria-hidden="true">监</span>
                <span class="tile-name">监察一码通</span>
              </span>
            </a>

            <button class="tile performance" type="button" data-workspace="performance" aria-label="业绩争议">
              <span class="direction" aria-hidden="true">→</span>
              <span class="tile-content">
                <span class="icon" aria-hidden="true">绩</span>
                <span class="tile-name">业绩争议</span>
              </span>
            </button>

            <div class="tile placeholder" aria-label="预留模块位"><span class="plus" aria-hidden="true">＋</span></div>
            <div class="tile placeholder" aria-label="预留模块位"><span class="plus" aria-hidden="true">＋</span></div>
            <div class="tile placeholder" aria-label="预留模块位"><span class="plus" aria-hidden="true">＋</span></div>
            <div class="tile placeholder" aria-label="预留模块位"><span class="plus" aria-hidden="true">＋</span></div>
          </section>
        </main>

        <footer>深圳贝壳品质工具箱</footer>
      </div>
    </div>

    <div class="overlay" id="workspace" hidden>
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="workspace-title">
        <button class="close" type="button" aria-label="关闭">×</button>
        <h2 id="workspace-title"></h2>
        <label for="workspace-input">记录事实</label>
        <textarea id="workspace-input"></textarea>
        <button class="copy" type="button" id="copy-workspace">复制给 AI 助手</button>
      </section>
    </div>

    <script>
      const workspaces = {
        complaint: {
          title: "客户投诉",
          placeholder: "写下时间、人物、客户原话和已做处理",
          prompt: "请以房地产客户服务主管的视角，整理以下客户投诉。只基于已提供的事实，不替任何一方下结论。请按事实时间线、客户核心诉求、需要核实的信息、责任边界、今天能执行的处理方案和对客户的回复话术输出。",
        },
        performance: {
          title: "业绩争议",
          placeholder: "写下时间、规则原文和双方说法",
          prompt: "请中立整理以下业绩争议，不替任何一方判定归属。请按关键时间线、适用规则或制度、各方主张、证据清单、仍有争议的事实、需要谁确认和两种低冲突的沟通话术输出。规则原文未提供时，请明确写出需要补充规则原文。",
        },
      };

      const overlay = document.getElementById("workspace");
      const title = document.getElementById("workspace-title");
      const input = document.getElementById("workspace-input");
      const copy = document.getElementById("copy-workspace");
      let activeWorkspace = null;

      function closeWorkspace() {
        overlay.hidden = true;
        activeWorkspace = null;
      }

      document.querySelectorAll("[data-workspace]").forEach((button) => {
        button.addEventListener("click", () => {
          activeWorkspace = workspaces[button.dataset.workspace];
          title.textContent = activeWorkspace.title;
          input.placeholder = activeWorkspace.placeholder;
          input.value = "";
          copy.textContent = "复制给 AI 助手";
          overlay.hidden = false;
          input.focus();
        });
      });

      document.querySelector(".close").addEventListener("click", closeWorkspace);
      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) closeWorkspace();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !overlay.hidden) closeWorkspace();
      });

      copy.addEventListener("click", async () => {
        if (!activeWorkspace) return;
        const content = activeWorkspace.prompt + "\n\n" + (input.value.trim() || "请填写事实。");
        try {
          await navigator.clipboard.writeText(content);
          copy.textContent = "已复制";
        } catch {
          input.value = content;
          input.select();
          document.execCommand("copy");
          copy.textContent = "已复制";
        }
      });
    </script>
  </body>
</html>
