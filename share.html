<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#087d4c" />
    <meta name="description" content="归心公开页面分享二维码。" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <title>归心｜分享二维码</title>
    <style>
      :root { --green: #00ae66; --ink: #1f2329; --muted: #69717b; --line: #e4ebe6; }
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 0%, rgba(0, 174, 102, .13), transparent 28rem), #f5f8f6;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 38px 32px 30px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 20px 54px rgba(31, 35, 41, .08);
        text-align: center;
      }
      .brand { display: inline-flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 800; letter-spacing: -.06em; }
      .mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; background: var(--green); color: #fff; font-size: 16px; }
      h1 { margin: 24px 0 7px; font-size: 24px; letter-spacing: -.05em; }
      p { margin: 0; color: var(--muted); font-size: 14px; }
      img { display: block; width: min(100%, 244px); height: auto; margin: 25px auto 18px; image-rendering: pixelated; }
      .url { display: block; overflow-wrap: anywhere; color: #087d4c; font-size: 13px; line-height: 1.6; text-decoration: none; }
      .hint { margin-top: 18px; font-size: 12px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
      .button { display: block; min-height: 44px; border: 1px solid var(--line); border-radius: 11px; padding: 12px; background: #f4f9f6; color: #087d4c; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; text-decoration: none; }
      .primary { grid-column: 1 / -1; border-color: #087d4c; background: #087d4c; color: white; }
      a:focus-visible, button:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
      .status { min-height: 1.5em; margin-top: 12px; font-size: 12px; }
      .copy-field { width: 100%; margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: var(--ink); font: inherit; font-size: 12px; }
      [hidden] { display: none !important; }
      @media (max-width: 420px) { body { padding: 14px; } main { padding: 32px 22px 24px; border-radius: 23px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark">归</span><span>归心</span></div>
      <h1>扫码打开归心</h1>
      <p>深圳贝壳品质工具箱</p>
      <img src="assets/guixin-qr.png" alt="归心公开页面二维码" />
      <a class="url" href="https://devi-y.github.io/guixin-public/">https://devi-y.github.io/guixin-public/</a>
      <div class="actions">
        <a class="button primary" href="./">打开归心</a>
        <button class="button" id="copy-link" type="button" hidden>复制链接</button>
        <a class="button" href="./assets/guixin-qr.png" download="归心二维码.png">保存二维码</a>
      </div>
      <input class="copy-field" id="copy-field" aria-label="归心公开链接" readonly hidden value="https://devi-y.github.io/guixin-public/" />
      <p class="status" id="share-status" role="status"></p>
      <p class="hint">在微信内可长按二维码保存或识别。</p>
    </main>
    <script>
      const copyButton = document.getElementById("copy-link");
      const copyField = document.getElementById("copy-field");
      const shareStatus = document.getElementById("share-status");
      copyButton.hidden = false;
      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(copyField.value);
          shareStatus.textContent = "链接已复制，可以发给同事。";
        } catch {
          copyField.hidden = false;
          copyField.focus();
          copyField.select();
          shareStatus.textContent = "请长按或复制下方已选中的链接。";
        }
      });
    </script>
  </body>
</html>
