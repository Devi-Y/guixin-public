<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#087d4c" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <title>归心｜访问统计</title>
    <style>
      :root {
        --ink: #1f2329;
        --muted: #68727b;
        --subtle: #9ba6a1;
        --line: #e3ebe6;
        --paper: #f5f8f6;
        --surface: #fff;
        --green: #00ae66;
        --green-dark: #087d4c;
        --green-soft: #eaf8f1;
        --danger: #b3424f;
      }

      * { box-sizing: border-box; }

      html, body { min-width: 320px; min-height: 100%; }

      body {
        min-height: 100dvh;
        margin: 0;
        background: radial-gradient(circle at 50% -10%, rgba(0, 174, 102, .1), transparent 34rem), var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button, input, select { font: inherit; }
      button { cursor: pointer; }

      .page {
        width: min(100% - 40px, 1080px);
        min-height: 100dvh;
        margin: 0 auto;
        padding-bottom: 32px;
      }

      header {
        display: flex;
        min-height: 76px;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }

      .brand { display: inline-flex; align-items: center; gap: 9px; }
      .mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 11px;
        background: var(--green);
        box-shadow: 0 7px 16px rgba(0, 174, 102, .18);
        color: #fff;
        font-size: 16px;
        font-weight: 800;
      }
      .brand strong { font-size: 20px; letter-spacing: -.05em; }

      .back-link {
        color: var(--green-dark);
        font-size: 14px;
        text-decoration: none;
      }
      .back-link:hover, .back-link:focus-visible { text-decoration: underline; }

      main { padding: 28px 0 0; }
      h1 { margin: 0; font-size: clamp(25px, 4vw, 34px); letter-spacing: -.06em; }
      .lead { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

      .state-card, .panel {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgba(255, 255, 255, .9);
        box-shadow: 0 10px 30px rgba(31, 35, 41, .04);
      }

      .state-card {
        width: min(100%, 440px);
        margin: 42px auto 0;
        padding: 28px;
      }

      .state-card h2 { margin: 0; font-size: 20px; letter-spacing: -.04em; }
      .state-card p { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
      .form-row { display: flex; gap: 9px; margin-top: 20px; }
      .token-input {
        min-width: 0;
        flex: 1;
        border: 1px solid #ccd9d1;
        border-radius: 10px;
        padding: 11px 12px;
        background: #fff;
        color: var(--ink);
        outline: 0;
      }
      .token-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(0, 174, 102, .12); }
      .primary-button, .secondary-button {
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 700;
      }
      .primary-button { border: 1px solid var(--green-dark); background: var(--green-dark); color: #fff; }
      .primary-button:hover, .primary-button:focus-visible { background: #006b3e; }
      .secondary-button { border: 1px solid var(--line); background: #fff; color: var(--green-dark); }
      .secondary-button:hover, .secondary-button:focus-visible { border-color: #a9dec2; background: var(--green-soft); }
      button:focus-visible, a:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
      .form-error { min-height: 1.4em; margin-top: 10px !important; color: var(--danger) !important; }

      [hidden] { display: none !important; }

      .dashboard-toolbar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-top: 28px;
      }
      .range-group { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
      .range-select {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 11px;
        background: #fff;
        color: var(--ink);
      }
      .toolbar-actions { display: flex; gap: 8px; }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }
      .summary-card { padding: 17px 18px; }
      .summary-card span { display: block; color: var(--muted); font-size: 13px; }
      .summary-card strong { display: block; margin-top: 9px; font-size: 27px; letter-spacing: -.05em; }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr);
        gap: 12px;
        margin-top: 12px;
      }
      .panel { min-width: 0; padding: 20px; }
      .panel h2 { margin: 0; font-size: 17px; letter-spacing: -.035em; }
      .panel-note { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
      .bar-list { display: grid; gap: 13px; margin-top: 20px; }
      .bar-row { display: grid; grid-template-columns: 105px minmax(0, 1fr) 34px; gap: 9px; align-items: center; font-size: 13px; }
      .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar-track { height: 9px; overflow: hidden; border-radius: 99px; background: #edf3ef; }
      .bar-fill { height: 100%; min-width: 3px; border-radius: inherit; background: linear-gradient(90deg, var(--green), #54c98e); }
      .bar-count { color: var(--muted); text-align: right; }
      .empty { margin: 22px 0 3px; color: var(--subtle); font-size: 13px; }

      .daily-list { display: grid; gap: 9px; margin-top: 18px; }
      .daily-row { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; color: var(--muted); font-size: 13px; }
      .daily-row strong { color: var(--ink); font-weight: 650; }

      .full-panel { margin-top: 12px; }
      .event-list, .visitor-list { display: grid; gap: 0; margin-top: 16px; }
      .event-row, .visitor-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 12px;
        align-items: center;
        border-top: 1px solid #eef3ef;
        padding: 11px 0;
        font-size: 13px;
      }
      .event-main, .visitor-main { min-width: 0; }
      .event-main strong, .visitor-main strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .event-main span, .visitor-main span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
      .event-type { color: var(--green-dark); font-size: 12px; white-space: nowrap; }
      .event-time, .visitor-time { color: var(--muted); font-size: 12px; white-space: nowrap; }
      .visitor-row { grid-template-columns: minmax(0, 1fr) auto auto auto; }

      .refresh-status { min-height: 1.3em; margin-top: 12px; color: var(--muted); font-size: 12px; }
      .refresh-status.is-error { color: var(--danger); }

      @media (max-width: 760px) {
        .page { width: min(100% - 28px, 640px); }
        .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .content-grid { grid-template-columns: 1fr; }
        .dashboard-toolbar { align-items: stretch; flex-direction: column; gap: 10px; }
        .toolbar-actions { justify-content: flex-end; }
      }

      @media (max-width: 480px) {
        header { min-height: 66px; }
        main { padding-top: 22px; }
        .state-card { margin-top: 28px; padding: 22px 18px; }
        .form-row { flex-direction: column; }
        .primary-button { width: 100%; }
        .bar-row { grid-template-columns: 92px minmax(0, 1fr) 28px; gap: 7px; }
        .event-row, .visitor-row { grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; }
        .event-type, .visitor-time { grid-column: 2; grid-row: 1; }
        .event-time, .visitor-row > :last-child { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="brand"><span class="mark" aria-hidden="true">归</span><strong>归心</strong></div>
        <a class="back-link" href="./">返回入口</a>
      </header>

      <main>
        <h1>访问统计</h1>
        <p class="lead">看访问人数、模块点击和最近活动</p>

        <section class="state-card" id="setup-state" hidden>
          <h2>统计服务未配置</h2>
          <p>先完成统计服务配置，再从这里查看数据。</p>
        </section>

        <section class="state-card" id="login-state" hidden>
          <h2>输入管理口令</h2>
          <p>口令只保存在本次浏览器会话，不会写入网址。</p>
          <form id="login-form">
            <div class="form-row">
              <input class="token-input" id="token-input" type="password" autocomplete="current-password" placeholder="管理口令" required />
              <button class="primary-button" type="submit">查看数据</button>
            </div>
            <p class="form-error" id="login-error" role="alert"></p>
          </form>
        </section>

        <section id="dashboard" hidden>
          <div class="dashboard-toolbar">
            <label class="range-group" for="range-select">时间范围
              <select class="range-select" id="range-select">
                <option value="7">近 7 天</option>
                <option value="30" selected>近 30 天</option>
                <option value="90">近 90 天</option>
              </select>
            </label>
            <div class="toolbar-actions">
              <button class="secondary-button" id="refresh-button" type="button">刷新</button>
              <button class="secondary-button" id="sign-out-button" type="button">退出</button>
            </div>
          </div>

          <div class="summary-grid" id="summary-grid"></div>

          <div class="content-grid">
            <section class="panel">
              <h2>模块点击</h2>
              <p class="panel-note">按次数排序</p>
              <div class="bar-list" id="tool-bars"></div>
            </section>
            <section class="panel">
              <h2>每日访问</h2>
              <p class="panel-note">访问与点击</p>
              <div class="daily-list" id="daily-list"></div>
            </section>
          </div>

          <section class="panel full-panel">
            <h2>最近访客</h2>
            <p class="panel-note">仅显示匿名访客编号，不显示姓名或手机号</p>
            <div class="visitor-list" id="visitor-list"></div>
          </section>

          <section class="panel full-panel">
            <h2>最近活动</h2>
            <p class="panel-note">最近 100 条访问和点击</p>
            <div class="event-list" id="event-list"></div>
          </section>
          <p class="refresh-status" id="refresh-status" role="status"></p>
        </section>
      </main>
    </div>

    <script src="./tools.js?v=20260903-2"></script>
    <script src="./analytics-config.js?v=20260907-2"></script>
    <script src="./analytics-dashboard.js?v=20260907-1"></script>
  </body>
</html>
