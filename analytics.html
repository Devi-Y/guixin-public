<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0d1d25" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <title>归心｜访问看板</title>
    <style>
      :root {
        --bg: #08141b;
        --panel: rgba(16, 37, 45, .88);
        --panel-soft: rgba(22, 49, 58, .72);
        --line: rgba(146, 207, 190, .16);
        --ink: #f3faf7;
        --muted: #94b0ae;
        --subtle: #678582;
        --green: #41d79a;
        --green-deep: #1aa978;
        --cyan: #71d8e4;
        --danger: #ff9b9b;
      }

      * { box-sizing: border-box; }

      html, body { min-width: 320px; min-height: 100%; }

      body {
        min-height: 100dvh;
        margin: 0;
        background:
          radial-gradient(circle at 80% -10%, rgba(65, 215, 154, .16), transparent 30rem),
          radial-gradient(circle at -10% 80%, rgba(113, 216, 228, .08), transparent 26rem),
          var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button, input, select { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
      [hidden] { display: none !important; }

      .screen { width: min(100% - 40px, 1180px); min-height: 100dvh; margin: 0 auto; padding-bottom: 28px; }

      .topbar {
        display: flex;
        min-height: 72px;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }

      .brand { display: inline-flex; align-items: center; gap: 10px; }
      .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; background: var(--green-deep); box-shadow: 0 0 24px rgba(65, 215, 154, .22); color: #fff; font-size: 16px; font-weight: 800; }
      .brand strong { font-size: 19px; letter-spacing: -.06em; }
      .topbar-right { display: flex; align-items: center; gap: 14px; }
      .live { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
      .live::before { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); content: ""; }
      .back-link { color: var(--green); font-size: 13px; text-decoration: none; }
      .back-link:hover { text-decoration: underline; }

      main { padding-top: 32px; }
      .hero { display: flex; align-items: end; justify-content: space-between; gap: 20px; }
      .eyebrow { display: block; color: var(--green); font-size: 11px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 8px 0 0; font-size: clamp(28px, 4.3vw, 42px); letter-spacing: -.07em; line-height: 1.05; }
      .lead { margin: 10px 0 0; color: var(--muted); font-size: 14px; }

      .toolbar { display: flex; align-items: center; gap: 8px; }
      .range-select, .button { min-height: 36px; border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; background: var(--panel-soft); color: var(--ink); font-size: 12px; }
      .range-select { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 14px) 15px, calc(100% - 10px) 15px; background-repeat: no-repeat; background-size: 4px 4px, 4px 4px; }
      .button { border-color: rgba(65, 215, 154, .32); background: rgba(26, 169, 120, .14); color: var(--green); font-weight: 700; }
      .button:hover { background: rgba(26, 169, 120, .25); }
      .button.ghost { border-color: transparent; background: transparent; color: var(--muted); font-weight: 500; }
      .button.ghost:hover { border-color: var(--line); color: var(--ink); }

      .state-card { width: min(100%, 470px); margin: 42px auto 0; border: 1px solid var(--line); border-radius: 18px; padding: 26px; background: var(--panel); box-shadow: 0 24px 70px rgba(0, 0, 0, .18); }
      .state-card h2 { margin: 0; font-size: 19px; letter-spacing: -.04em; }
      .state-card p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
      .form-row { display: flex; gap: 8px; margin-top: 18px; }
      .token-input { min-width: 0; flex: 1; border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; background: #091820; color: var(--ink); outline: 0; }
      .token-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(65, 215, 154, .12); }
      .form-error { min-height: 1.4em; margin: 9px 0 0 !important; color: var(--danger) !important; }

      #dashboard { margin-top: 30px; }
      .dashboard-toolbar { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
      .dashboard-toolbar .toolbar { margin-left: auto; }

      .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
      .metric-card, .panel { min-width: 0; border: 1px solid var(--line); background: linear-gradient(145deg, rgba(18, 46, 54, .9), rgba(10, 28, 35, .86)); box-shadow: 0 18px 48px rgba(0, 0, 0, .13); }
      .metric-card { position: relative; overflow: hidden; border-radius: 14px; padding: 18px; }
      .metric-card::after { position: absolute; right: -22px; bottom: -36px; width: 110px; height: 110px; border: 1px solid rgba(65, 215, 154, .14); border-radius: 50%; content: ""; }
      .metric-label { display: block; color: var(--muted); font-size: 12px; }
      .metric-value { display: block; margin-top: 11px; color: var(--ink); font-size: clamp(24px, 3vw, 33px); font-weight: 750; letter-spacing: -.06em; line-height: 1; }
      .metric-note { display: block; margin-top: 10px; color: var(--subtle); font-size: 11px; }

      .board-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 10px; margin-top: 10px; }
      .panel { border-radius: 14px; padding: 18px; }
      .panel-heading { display: flex; align-items: start; justify-content: space-between; gap: 14px; }
      .panel h2 { margin: 0; color: var(--ink); font-size: 16px; letter-spacing: -.04em; }
      .panel-note { margin: 5px 0 0; color: var(--subtle); font-size: 11px; }
      .legend { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; white-space: nowrap; }
      .legend::before { width: 6px; height: 6px; border-radius: 50%; background: var(--green); content: ""; }
      .trend-chart { display: flex; min-height: 168px; align-items: end; gap: clamp(5px, 1vw, 11px); margin-top: 22px; padding: 0 2px 22px; border-bottom: 1px solid var(--line); }
      .trend-empty { align-self: center; margin: 0 auto; color: var(--subtle); font-size: 12px; }
      .trend-column { display: flex; min-width: 0; height: 146px; flex: 1; flex-direction: column; align-items: center; justify-content: end; gap: 6px; }
      .trend-value { min-height: 13px; color: var(--muted); font-size: 10px; }
      .trend-bar-wrap { display: flex; width: min(100%, 28px); height: 116px; align-items: end; border-radius: 6px 6px 2px 2px; background: rgba(126, 173, 169, .08); }
      .trend-bar { width: 100%; min-height: 4px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--green), var(--green-deep)); box-shadow: 0 0 18px rgba(65, 215, 154, .15); }
      .trend-label { overflow: hidden; max-width: 100%; color: var(--subtle); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }

      .bar-list { display: grid; gap: 14px; margin-top: 22px; }
      .bar-row { display: grid; grid-template-columns: minmax(90px, 130px) minmax(0, 1fr) 28px; gap: 9px; align-items: center; font-size: 12px; }
      .bar-label { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
      .bar-track { height: 8px; overflow: hidden; border-radius: 99px; background: rgba(126, 173, 169, .1); }
      .bar-fill { display: block; height: 100%; min-width: 4px; border-radius: inherit; background: linear-gradient(90deg, var(--cyan), var(--green)); }
      .bar-count { color: var(--ink); text-align: right; }

      .lower-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 10px; }
      .visitor-list, .event-list { display: grid; margin-top: 13px; }
      .visitor-row, .event-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; border-top: 1px solid rgba(146, 207, 190, .1); padding: 11px 0; }
      .visitor-main, .event-main { min-width: 0; }
      .visitor-main strong, .event-main strong { display: block; overflow: hidden; color: var(--ink); font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
      .visitor-main span, .event-main span { display: block; overflow: hidden; margin-top: 4px; color: var(--subtle); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .visitor-side, .event-side { color: var(--muted); font-size: 11px; text-align: right; white-space: nowrap; }
      .identity-badge { display: inline-block; margin-left: 6px; border: 1px solid rgba(65, 215, 154, .28); border-radius: 999px; padding: 2px 5px; color: var(--green); font-size: 9px; font-weight: 650; vertical-align: 1px; }
      .empty { margin: 24px 0 4px; color: var(--subtle); font-size: 12px; }
      .refresh-status { min-height: 1.4em; margin: 12px 2px 0; color: var(--subtle); font-size: 11px; }
      .refresh-status.is-error { color: var(--danger); }

      @media (max-width: 820px) {
        .screen { width: min(100% - 28px, 680px); }
        .hero { align-items: start; flex-direction: column; }
        .hero .toolbar { width: 100%; }
        .hero .range-select { flex: 1; }
        .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .board-grid, .lower-grid { grid-template-columns: 1fr; }
        .dashboard-toolbar { align-items: start; flex-direction: column; }
        .dashboard-toolbar .toolbar { width: 100%; }
        .dashboard-toolbar .range-select { flex: 1; }
      }

      @media (max-width: 500px) {
        .screen { width: 100%; padding-bottom: 20px; }
        .topbar { min-height: 64px; padding: 0 14px; }
        .topbar-right { gap: 9px; }
        .live { display: none; }
        main { padding-top: 24px; }
        .hero, #dashboard, .state-card { margin-right: 14px; margin-left: 14px; }
        .state-card { padding: 22px 18px; }
        .form-row { flex-direction: column; }
        .form-row .button { width: 100%; }
        .metric-card { padding: 15px; }
        .metric-value { font-size: 26px; }
        .panel { padding: 15px; }
        .trend-chart { gap: 4px; }
        .trend-bar-wrap { width: 22px; }
        .bar-row { grid-template-columns: minmax(86px, 1fr) minmax(0, 1.4fr) 24px; gap: 7px; }
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">归</span><strong>归心访问看板</strong></div>
        <div class="topbar-right"><span class="live">实时入口数据</span><a class="back-link" href="./">返回归心</a></div>
      </header>

      <main>
        <section class="hero">
          <div>
            <span class="eyebrow">GUIXIN / INSIGHT</span>
            <h1>看访问，也看入口热度</h1>
            <p class="lead">只保留经纪人和管理者真正需要的数字</p>
          </div>
          <div class="toolbar">
            <select class="range-select" id="range-select" aria-label="时间范围">
              <option value="7">近 7 天</option>
              <option value="30" selected>近 30 天</option>
              <option value="90">近 90 天</option>
            </select>
            <button class="button" id="refresh-button" type="button">刷新</button>
          </div>
        </section>

        <section class="state-card" id="setup-state" hidden>
          <h2>统计服务未配置</h2>
          <p>完成统计服务配置后，这里会显示看板。</p>
        </section>

        <section class="state-card" id="login-state" hidden>
          <h2>进入访问看板</h2>
          <p>输入管理口令，口令只保存在本次浏览器会话。</p>
          <form id="login-form">
            <div class="form-row">
              <input class="token-input" id="token-input" type="password" autocomplete="current-password" placeholder="管理口令" required />
              <button class="button" type="submit">查看数据</button>
            </div>
            <p class="form-error" id="login-error" role="alert"></p>
          </form>
        </section>

        <section id="dashboard" hidden>
          <div class="dashboard-toolbar">
            <p class="panel-note">数据范围随上方选择更新</p>
            <button class="button ghost" id="sign-out-button" type="button">退出看板</button>
          </div>

          <div class="metric-grid" id="summary-grid"></div>

          <div class="board-grid">
            <section class="panel">
              <div class="panel-heading">
                <div><h2>访问趋势</h2><p class="panel-note">每天进入归心的人次</p></div>
                <span class="legend">访问</span>
              </div>
              <div class="trend-chart" id="daily-list"></div>
            </section>

            <section class="panel">
              <div class="panel-heading">
                <div><h2>入口热度</h2><p class="panel-note">点击最多的模块</p></div>
                <span class="legend">点击</span>
              </div>
              <div class="bar-list" id="tool-bars"></div>
            </section>
          </div>

          <div class="lower-grid">
            <section class="panel">
              <div class="panel-heading"><div><h2>最近访客</h2><p class="panel-note">已登录成员显示企业微信姓名</p></div></div>
              <div class="visitor-list" id="visitor-list"></div>
            </section>
            <section class="panel">
              <div class="panel-heading"><div><h2>最近动态</h2><p class="panel-note">进入网站和点击模块</p></div></div>
              <div class="event-list" id="event-list"></div>
            </section>
          </div>
          <p class="refresh-status" id="refresh-status" role="status"></p>
        </section>
      </main>
    </div>

    <script src="./tools.js?v=20260903-2"></script>
    <script src="./analytics-config.js?v=20260907-3"></script>
    <script src="./analytics-dashboard.js?v=20260907-3"></script>
  </body>
</html>
